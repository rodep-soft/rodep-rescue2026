servo_node:
  ros__parameters:
    moveit_servo:
      move_group_name: sekirei_arm
      planning_frame: base_link
      ee_frame_name: arm6_link

      lower_singularity_threshold: 1.0e9
      hard_stop_singularity_threshold: 1.0e12

      command_in_type: unitless
      scale:
        linear: 0.15
        rotational: 0.8
        joint: 0.6

      # 出力先：ros2_controlのJTCへ（合ってるか超重要）
      command_out_topic: /sekirei_arm_controller/joint_trajectory

      publish_period: 0.02
      command_timeout: 0.1

      check_collisions: true
      collision_check_rate: 50.0
      self_collision_proximity_threshold: 0.02
      scene_collision_proximity_threshold: 0.02